name: Docker Image Release

on:
  push:
    branches:
      - master
      - dev
    # 문서만 바뀐 push는 docs.yml에서 따로 배포하므로 릴리즈를 건너뜁니다.
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      manual_version:
        description: '수동으로 빌드와 릴리즈를 진행할 때, 버전을 지정합니다. 값을 넣을 경우 semantic-release를 스킵합니다.'
        required: false
        type: string

env:
  IMAGE_PREFIX: ghcr.io/scfs-miraepass/mirae-pass

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: ${{ !inputs.manual_version }}
    outputs:
      new_version: ${{ steps.extract.outputs.NEW_VERSION }}
    steps:
      # 브랜치 규칙을 우회할 수 있는 GitHub App 토큰으로 릴리스 커밋을 푸시합니다.
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # 릴리스 커밋 작성자를 App 봇 계정으로 표시하기 위해 이름과 noreply 이메일을 만듭니다.
      - name: Get release bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          BOT_ID=$(gh api "/users/$BOT_NAME" --jq .id)
          echo "name=$BOT_NAME" >> "$GITHUB_OUTPUT"
          echo "email=$BOT_ID+$BOT_NAME@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      # 설치 스크립트를 건너뛰어 pre-commit 훅이 설치되지 않게 합니다.
      # 훅이 있으면 릴리스 커밋마다 타입 검사가 실행됩니다.
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          touch build.env
          yarn semantic-release

      - name: Export version variable
        id: extract
        run: |
          source build.env
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  manual-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ inputs.manual_version }}
    outputs:
      version: ${{ inputs.manual_version }}
    steps:
      # 브랜치 규칙을 우회할 수 있는 GitHub App 토큰으로 릴리스 커밋을 푸시합니다.
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # 릴리스 커밋 작성자를 App 봇 계정으로 표시하기 위해 이름과 noreply 이메일을 만듭니다.
      - name: Get release bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          BOT_ID=$(gh api "/users/$BOT_NAME" --jq .id)
          echo "name=$BOT_NAME" >> "$GITHUB_OUTPUT"
          echo "email=$BOT_ID+$BOT_NAME@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Create release commit and tag
        id: release
        env:
          MANUAL_VERSION: ${{ inputs.manual_version }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: node .github/scripts/manual-release.mjs

      - name: Create GitHub Release
        if: ${{ steps.release.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MANUAL_VERSION: ${{ inputs.manual_version }}
        run: |
          PRERELEASE=""
          case "$MANUAL_VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v$MANUAL_VERSION" --verify-tag --title "v$MANUAL_VERSION" --notes-file release-notes.md $PRERELEASE

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [semantic-release, manual-release]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.manual-release.outputs.version || needs.semantic-release.outputs.new_version) }}
    env:
      VERSION: ${{ needs.manual-release.outputs.version || needs.semantic-release.outputs.new_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: client
            context: .
          - app: admin
            context: .
          - app: server
            context: server
    steps:
      # 릴리스 커밋의 버전이 이미지에 들어가도록 새 태그를 체크아웃합니다.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v${{ env.VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

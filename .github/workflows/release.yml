name: Docker Image Release

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      manual_version:
        description: '수동으로 빌드와 릴리즈를 진행할 때, 버전을 지정합니다. 값을 넣을 경우 semantic-release를 스킵합니다.'
        required: false
        type: string

env:
  IMAGE_PREFIX: ghcr.io/scfs-miraepass/mirae-pass

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: ${{ !inputs.manual_version }}
    outputs:
      new_version: ${{ steps.extract.outputs.NEW_VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      # 설치 스크립트를 건너뛰어 pre-commit 훅이 설치되지 않게 합니다.
      # 훅이 있으면 릴리스 커밋마다 타입 검사가 실행됩니다.
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch build.env
          yarn semantic-release

      - name: Export version variable
        id: extract
        run: |
          source build.env
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [semantic-release]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (inputs.manual_version || needs.semantic-release.outputs.new_version) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: client
            context: .
          - app: admin
            context: .
          - app: server
            context: server
    steps:
      # 릴리스 커밋의 버전이 이미지에 들어가도록 새 태그를 체크아웃합니다.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.new_version && format('v{0}', needs.semantic-release.outputs.new_version) || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}
          tags: |
            type=raw,value=${{ inputs.manual_version || needs.semantic-release.outputs.new_version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

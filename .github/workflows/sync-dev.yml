name: Sync dev

# master에서 릴리스(또는 문서 배포)가 끝나면 master의 변경 사항을 dev에 반영합니다.
# workflow_run은 기본 브랜치(master)에 있는 이 파일 기준으로 실행됩니다.
on:
  workflow_run:
    workflows:
      - Docker Image Release
      - Docs Deploy
    types: [completed]
    branches: [master]
  workflow_dispatch:

# 두 워크플로가 연달아 끝나도 동기화는 하나씩 순서대로 실행합니다.
concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # 브랜치 규칙을 우회할 수 있는 GitHub App 토큰으로 dev에 푸시합니다.
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # merge 커밋 작성자를 App 봇 계정으로 표시하기 위해 이름과 noreply 이메일을 만듭니다.
      - name: Get release bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          BOT_ID=$(gh api "/users/$BOT_NAME" --jq .id)
          echo "name=$BOT_NAME" >> "$GITHUB_OUTPUT"
          echo "email=$BOT_ID+$BOT_NAME@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Sync dev with master
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: sh .github/scripts/sync-dev.sh

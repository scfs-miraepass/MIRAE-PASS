name: PR Check

# PR을 열거나 커밋을 올릴 때마다 실행됩니다.
# 1. 자동 수정: 마이그레이션 합류, SDK 재생성을 PR 브랜치에 커밋합니다. (dev 대상, 같은 저장소 브랜치만)
# 2. 검사: 서버 코드, 마이그레이션, SDK, 프론트엔드를 검사합니다. 바뀐 영역만 검사합니다.
# 3. 결과: 'PR 검사 결과' 하나로 모아, 브랜치 보호의 필수 검사로 사용합니다.
on:
  pull_request:
    branches:
      - dev
      - master

# 같은 PR에 새 커밋이 올라오면 이전 검사는 취소합니다.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: 바뀐 영역 확인
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.detect.outputs.server }}
      sdk: ${{ steps.detect.outputs.sdk }}
      client: ${{ steps.detect.outputs.client }}
      admin: ${{ steps.detect.outputs.admin }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 워크플로나 검사 스크립트가 바뀌면 모든 검사를 실행합니다.
      - name: Detect changed areas
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "$files"
          has() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          all=$(has '^\.github/(workflows/pr-check\.yml|scripts/)')
          shared='^(package\.json|yarn\.lock|\.yarnrc\.yml|api-client/)'
          [ "$all" = true ] && t=true || t=false
          echo "server=$([ $t = true ] && echo true || has '^server/')" >> "$GITHUB_OUTPUT"
          echo "sdk=$([ $t = true ] && echo true || has '^(server/|api-client/)')" >> "$GITHUB_OUTPUT"
          echo "client=$([ $t = true ] && echo true || has "$shared|^client/")" >> "$GITHUB_OUTPUT"
          echo "admin=$([ $t = true ] && echo true || has "$shared|^admin/")" >> "$GITHUB_OUTPUT"

  autofix:
    name: 자동 수정
    runs-on: ubuntu-latest
    needs: changes
    # fork PR에는 push할 수 없고, 릴리스 PR(dev → master)의 dev 브랜치는 건드리지 않습니다.
    if: >-
      needs.changes.outputs.sdk == 'true'
      && github.base_ref == 'dev'
      && github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      pushed: ${{ steps.fix.outputs.pushed }}
    steps:
      # App 토큰으로 push해야 push 뒤에 검사가 다시 실행됩니다.
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Get release bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          BOT_ID=$(gh api "/users/$BOT_NAME" --jq .id)
          echo "name=$BOT_NAME" >> "$GITHUB_OUTPUT"
          echo "email=$BOT_ID+$BOT_NAME@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      # 검사용 merge 커밋이 아닌 PR 브랜치 자체를 체크아웃해야 커밋을 올릴 수 있습니다.
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Fix migrations and SDK
        id: fix
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: sh .github/scripts/pr-autofix.sh

  # 자동 수정이 커밋을 올렸다면 새 커밋에서 검사가 다시 실행되므로, 아래 검사는 건너뜁니다.
  server:
    name: 서버 코드 검사
    runs-on: ubuntu-latest
    needs: [changes, autofix]
    if: >-
      always() && !cancelled()
      && needs.changes.outputs.server == 'true'
      && needs.autofix.outputs.pushed != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      # 커밋 전 검사(pre-commit)와 같은 ruff 버전·설정으로 검사합니다.
      - name: Ruff check
        run: uv run --locked --project server pre-commit run ruff-check --all-files --show-diff-on-failure

      - name: Ruff format
        run: uv run --locked --project server pre-commit run ruff-format --all-files --show-diff-on-failure

  migration:
    name: 마이그레이션 검사
    runs-on: ubuntu-latest
    needs: [changes, autofix]
    if: >-
      always() && !cancelled()
      && needs.changes.outputs.server == 'true'
      && needs.autofix.outputs.pushed != 'true'
    services:
      # 운영·개발 Docker Compose와 같은 이미지를 사용합니다.
      mysql:
        image: mysql
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: miraepass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+aiomysql://root:ci@127.0.0.1:3306/miraepass
      REDIS_URL: redis://127.0.0.1:6379
      ALLOWED_ORIGINS: '*'
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Check migrations
        working-directory: server
        run: sh ../.github/scripts/check-migrations.sh

  sdk:
    name: SDK 검사
    runs-on: ubuntu-latest
    needs: [changes, autofix]
    if: >-
      always() && !cancelled()
      && needs.changes.outputs.sdk == 'true'
      && needs.autofix.outputs.pushed != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Regenerate SDK
        env:
          DATABASE_URL: mysql+aiomysql://ci:ci@127.0.0.1:3306/ci
          REDIS_URL: redis://127.0.0.1:6379
          ALLOWED_ORIGINS: '*'
        run: |
          uv run --locked --project server python -I .github/scripts/dump-openapi.py "$RUNNER_TEMP/openapi.json"
          OPENAPI_INPUT="$RUNNER_TEMP/openapi.json" yarn sdk-gen > /dev/null

      - name: Compare SDK
        run: |
          if git diff --quiet -- api-client/src/gen; then
            echo "## ✅ SDK가 서버 API와 같습니다" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --stat -- api-client/src/gen
          {
            echo "## ❌ SDK가 서버 API와 다릅니다"
            echo
            echo "- PR 화면에서 **Update branch** 버튼을 눌러 보세요. 같은 저장소의 브랜치라면 자동 수정이 SDK를 다시 만듭니다."
            echo "- fork에서 올라온 PR이라면 로컬에서 \`yarn sdk-gen\`을 실행해 커밋하세요. ([SDK 생성하기](https://docs.miraepass.xyz/api/sdk#sdk-생성하기))"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::SDK(api-client/src/gen)가 서버 API와 다릅니다."
          exit 1

  frontend:
    name: 프론트엔드 검사 (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [changes, autofix]
    if: >-
      always() && !cancelled()
      && (needs.changes.outputs.client == 'true' || needs.changes.outputs.admin == 'true')
      && needs.autofix.outputs.pushed != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: client
            workspace: scfs-miraepass-front
          - app: admin
            workspace: scfs-miraepass-dashboard
    steps:
      - name: Check if this app changed
        id: target
        run: echo "run=${{ needs.changes.outputs[matrix.app] }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.target.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Enable Corepack
        if: steps.target.outputs.run == 'true'
        run: corepack enable

      - name: Setup Node.js
        if: steps.target.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        if: steps.target.outputs.run == 'true'
        run: |
          yarn install --immutable --mode=skip-build
          yarn workspace ${{ matrix.workspace }} postinstall

      - name: Typecheck
        if: steps.target.outputs.run == 'true'
        run: yarn typecheck:${{ matrix.app }}

      - name: Build
        if: steps.target.outputs.run == 'true'
        run: yarn build:${{ matrix.app }}

  result:
    name: PR 검사 결과
    runs-on: ubuntu-latest
    needs: [changes, autofix, server, migration, sdk, frontend]
    if: always()
    steps:
      - name: Summarize
        env:
          RESULTS: ${{ toJSON(needs) }}
          PUSHED: ${{ needs.autofix.outputs.pushed }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$PUSHED" = true ]; then
            echo "## 🔧 자동 수정 커밋을 올렸습니다. 새 커밋에서 검사가 다시 실행됩니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::실패한 검사가 있습니다. 실패한 항목의 Details를 눌러 작업 요약을 확인하세요."
            exit 1
          fi

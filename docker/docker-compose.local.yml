services:
  client:
    image: ghcr.io/scfs-miraepass/mirae-pass/client:1.14.1
    ports: !override
      - "127.0.0.1:3330:3000"
  admin:
    image: ghcr.io/scfs-miraepass/mirae-pass/admin:1.14.1
  server:
    image: ghcr.io/scfs-miraepass/mirae-pass/server:1.14.1
    volumes: !override
      - miraepass_test_logs:/app/logs
  database:
    volumes: !override
      - miraepass_test_db:/var/lib/mysql
volumes:
  miraepass_test_db:
  miraepass_test_logs:
